services:

  # ==========================================================
  # PostgreSQL 16
  # ==========================================================
  postgres_db:
    image: postgres:16
    container_name: postgres_world_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-world_db}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_world_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-world_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - world_network

  # ==========================================================
  # pgAdmin 4 (Administrador Web)
  # ==========================================================
  pgadmin_web:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_world_db
    depends_on:
      postgres_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-Admin12345!}
    ports:
      - "${PGADMIN_PORT:-8083}:80"
    volumes:
      - pgadmin_world_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - world_network

volumes:
  postgres_world_data:
  pgadmin_world_data:

networks:
  world_network:
    driver: bridge
